{% load static %}
{% load django_bootstrap5 %}
{% include "header.html" %}
<div class="bradcam_area bradcam_bg_1">
  <div class="container">
      <div class="row">
          <div class="col-xl-12">
              <div class="bradcam_text">
                  <h3> My Profile</h3>
              </div>
          </div>
      </div>
  </div>
</div>
<div class="job_details_area">
      <div class="container" >
            <div class="row">
                <div class="col-lg-8 mx-auto" >
                    <div class="job_sumary" >
                        <div class="summery_header" >
                            <h3>Profile Summery</h3>
                        </div>
                        <div class="job_content">
                            <ul>
                                <li>Username : <span>{{profile}}</span></li>
                                <li>Email: <span>{{profile.user.email}}</span></li>
                                <li>Phone: <span>{{profile.phone_number}}</span></li>
                                <li>Adress: <span>{{profile.city}}</span></li>
                            </ul>
                            
                        </div>
                        <div class="p-5"> 
                            <a class="btn btn-success w-40 mb-2" href="{% url 'accounts:profile_edit' %}">Edit Profile</a>
                            <form method="POST" action="{% url 'accounts:logout_user' %}">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-primary w-40">Log out</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
      </div>
</div>


{% include "footer.html" %}
